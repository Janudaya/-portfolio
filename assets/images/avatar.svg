<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b997" />
      <stop offset="100%" stop-color="#c99b73" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative circular glow -->
  <circle cx="200" cy="200" r="175" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="170" stroke="url(#glowCircle)" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="200" cy="200" r="150" fill="#6366f1" opacity="0.1" filter="url(#softGlow)" />

  <!-- Code elements floating in background -->
  <g opacity="0.4" font-family="monospace" font-size="12" fill="#38bdf8">
    <text x="45" y="110">&lt;div class="dev"&gt;</text>
    <text x="45" y="130">&nbsp;&nbsp;engineer.init();</text>
    <text x="45" y="150">&lt;/div&gt;</text>
    <text x="260" y="270">async run() {</text>
    <text x="270" y="290">&nbsp;&nbsp;await build();</text>
    <text x="260" y="310">}</text>
  </g>

  <!-- Person Avatar -->
  <!-- Shoulders / Jacket -->
  <path d="M90 380 C95 295 140 260 200 260 C260 260 305 295 310 380 Z" fill="url(#jacketGrad)" stroke="#334155" stroke-width="2" />
  <!-- Shirt V-neck -->
  <path d="M165 260 L200 325 L235 260 Z" fill="url(#shirtGrad)" />
  <!-- Neck -->
  <path d="M175 220 L175 270 C175 285 225 285 225 270 L225 220 Z" fill="url(#skinGrad)" />
  <!-- Head / Face -->
  <rect x="150" y="125" width="100" height="115" rx="50" fill="url(#skinGrad)" />
  <!-- Ears -->
  <circle cx="148" cy="180" r="12" fill="#c99b73" />
  <circle cx="252" cy="180" r="12" fill="#c99b73" />
  <!-- Modern Stylish Hair -->
  <path d="M145 150 C140 100 170 80 200 80 C240 80 260 100 255 150 C245 130 230 120 200 120 C170 120 155 135 145 150 Z" fill="url(#hairGrad)" />
  <!-- Eyebrows -->
  <rect x="165" y="158" width="22" height="4" rx="2" fill="#171717" />
  <rect x="213" y="158" width="22" height="4" rx="2" fill="#171717" />
  <!-- Stylish modern glasses -->
  <rect x="160" y="168" width="32" height="24" rx="7" fill="none" stroke="#0ea5e9" stroke-width="3.5" />
  <rect x="208" y="168" width="32" height="24" rx="7" fill="none" stroke="#0ea5e9" stroke-width="3.5" />
  <path d="M192 178 L208 178" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round" />
  <path d="M148 176 L160 176" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <path d="M240 176 L252 176" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
  <!-- Eyes -->
  <circle cx="176" cy="180" r="4" fill="#0f172a" />
  <circle cx="224" cy="180" r="4" fill="#0f172a" />
  <circle cx="178" cy="178" r="1.5" fill="#ffffff" />
  <circle cx="226" cy="178" r="1.5" fill="#ffffff" />
  <!-- Confident friendly smile -->
  <path d="M185 212 Q200 224 215 212" stroke="#99583d" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Subtle beard/trim -->
  <path d="M172 215 C180 235 220 235 228 215" stroke="#372d24" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" fill="none" opacity="0.6" />

  <!-- Floating Tech Badges around avatar -->
  <g transform="translate(45, 230)">
    <rect width="65" height="32" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="32.5" y="20" fill="#a5b4fc" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">&lt;React/&gt;</text>
  </g>
  <g transform="translate(290, 110)">
    <rect width="65" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="32.5" y="20" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Laravel</text>
  </g>
  <g transform="translate(290, 220)">
    <rect width="65" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="32.5" y="20" fill="#fcd34d" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Java SE</text>
  </g>
  <g transform="translate(45, 120)">
    <rect width="65" height="32" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <text x="32.5" y="20" fill="#f472b6" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">Premiere</text>
  </g>
</svg>
