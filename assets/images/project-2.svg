<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="16" fill="#090d16"/>
  <defs>
    <linearGradient id="p2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Mobile Phone Frame Centered -->
  <rect x="210" y="20" width="180" height="320" rx="28" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="260" y="28" width="80" height="8" rx="4" fill="#0f172a"/>
  <!-- Phone Screen -->
  <rect x="220" y="42" width="160" height="280" rx="18" fill="#0f172a"/>
  
  <!-- App Header -->
  <rect x="220" y="42" width="160" height="44" fill="#1e1b4b"/>
  <circle cx="240" cy="64" r="12" fill="url(#p2g)"/>
  <text x="260" y="62" fill="#f8fafc" font-size="10" font-weight="bold" font-family="sans-serif">Dev Team Chat</text>
  <text x="260" y="73" fill="#10b981" font-size="8" font-family="sans-serif">&#x25CF; 14 Online</text>
  
  <!-- Chat bubbles -->
  <rect x="230" y="100" width="100" height="30" rx="10" fill="#1e293b"/>
  <text x="240" y="118" fill="#cbd5e1" font-size="9" font-family="sans-serif">Hey, API deployed?</text>
  
  <rect x="260" y="140" width="110" height="30" rx="10" fill="#4f46e5"/>
  <text x="270" y="158" fill="#ffffff" font-size="9" font-family="sans-serif">Yes! Sockets connected.</text>
  
  <rect x="230" y="180" width="105" height="30" rx="10" fill="#1e293b"/>
  <text x="240" y="198" fill="#cbd5e1" font-size="9" font-family="sans-serif">Latency under 12ms</text>
  
  <rect x="255" y="220" width="115" height="30" rx="10" fill="#4f46e5"/>
  <text x="265" y="238" fill="#ffffff" font-size="9" font-family="sans-serif">Firebase sync verified!</text>
  
  <!-- Bottom Bar -->
  <rect x="225" y="280" width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="240" y="300" fill="#64748b" font-size="9" font-family="sans-serif">Write message...</text>
  <circle cx="358" cy="296" r="9" fill="url(#p2g)"/>

  <!-- Floating Tech Badges -->
  <g transform="translate(60, 100)">
    <rect width="120" height="52" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="60" y="32" fill="#a5b4fc" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">React Native</text>
  </g>
  <g transform="translate(420, 180)">
    <rect width="120" height="52" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="32" fill="#fde68a" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Firebase Sync</text>
  </g>
</svg>
