<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="16" fill="#18181b"/>
  <!-- Cyber / 3D Grid Floor -->
  <path d="M0 260 L600 260 M0 290 L600 290 M0 330 L600 330" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
  <path d="M100 260 L0 360 M220 260 L140 360 M300 260 L300 360 M380 260 L460 360 M500 260 L600 360" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>

  <!-- 3D Polyhedron / Cube Wireframe in Game Engine -->
  <g transform="translate(300, 140)">
    <!-- Top Face -->
    <polygon points="0,-55 60,-25 0,5 -60,-25" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-60,-25 0,5 0,75 -60,45" fill="#7c3aed" fill-opacity="0.4" stroke="#a855f7" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,5 60,-25 60,45 0,75" fill="#6d28d9" fill-opacity="0.5" stroke="#c084fc" stroke-width="2"/>
    <!-- Center glowing core -->
    <circle cx="0" cy="10" r="14" fill="#38bdf8"/>
    <circle cx="0" cy="10" r="22" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Gamepad HUD Elements -->
  <rect x="50" y="40" width="130" height="40" rx="8" fill="#27272a" stroke="#a855f7" stroke-width="1"/>
  <text x="62" y="58" fill="#e9d5ff" font-size="10" font-family="monospace">SCORE: 48,920</text>
  <text x="62" y="72" fill="#34d399" font-size="10" font-family="monospace">FPS: 60 (STABLE)</text>

  <rect x="420" y="40" width="130" height="40" rx="8" fill="#27272a" stroke="#a855f7" stroke-width="1"/>
  <text x="432" y="58" fill="#e9d5ff" font-size="10" font-family="monospace">ENGINE: UNITY 3D</text>
  <text x="432" y="72" fill="#38bdf8" font-size="10" font-family="monospace">PHYSICS: C# CORE</text>
</svg>
