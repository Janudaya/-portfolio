<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="16" fill="#1e1b4b"/>
  <!-- Window Chrome -->
  <rect x="40" y="30" width="520" height="300" rx="10" fill="#0f172a" stroke="#4338ca" stroke-width="2"/>
  <rect x="40" y="30" width="520" height="36" fill="#312e81"/>
  <circle cx="60" cy="48" r="5" fill="#ef4444"/>
  <circle cx="80" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="48" r="5" fill="#10b981"/>
  <text x="180" y="52" fill="#e0e7ff" font-size="12" font-weight="bold" font-family="sans-serif">Student Management OS [Java FX / MySQL Enterprise]</text>
  
  <!-- Stats row -->
  <rect x="60" y="85" width="145" height="55" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="75" y="105" fill="#a5b4fc" font-size="11" font-family="sans-serif">Total Enrolled</text>
  <text x="75" y="128" fill="#ffffff" font-size="18" font-weight="bold" font-family="sans-serif">3,850 Students</text>
  
  <rect x="225" y="85" width="150" height="55" rx="8" fill="#1e1b4b" stroke="#10b981" stroke-width="1"/>
  <text x="240" y="105" fill="#a7f3d0" font-size="11" font-family="sans-serif">Average GPA</text>
  <text x="240" y="128" fill="#ffffff" font-size="18" font-weight="bold" font-family="sans-serif">3.62 / 4.0</text>
  
  <rect x="395" y="85" width="145" height="55" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1"/>
  <text x="410" y="105" fill="#fde68a" font-size="11" font-family="sans-serif">Database Health</text>
  <text x="410" y="128" fill="#ffffff" font-size="16" font-weight="bold" font-family="sans-serif">Synced &amp; Active</text>
  
  <!-- Table Header -->
  <rect x="60" y="160" width="480" height="30" fill="#1e293b"/>
  <text x="75" y="180" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">STUDENT ID</text>
  <text x="180" y="180" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">NAME</text>
  <text x="320" y="180" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">FACULTY</text>
  <text x="450" y="180" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif">STATUS</text>
  
  <!-- Row 1 -->
  <line x1="60" y1="225" x2="540" y2="225" stroke="#334155" stroke-width="1"/>
  <text x="75" y="215" fill="#cbd5e1" font-size="11" font-family="monospace">BCU-SE-102</text>
  <text x="180" y="215" fill="#ffffff" font-size="11" font-family="sans-serif">Alexander Wright</text>
  <text x="320" y="215" fill="#a5b4fc" font-size="11" font-family="sans-serif">Software Engineering</text>
  <rect x="450" y="202" width="65" height="18" rx="9" fill="#065f46"/>
  <text x="462" y="215" fill="#34d399" font-size="10" font-weight="bold" font-family="sans-serif">ACTIVE</text>
  
  <!-- Row 2 -->
  <line x1="60" y1="260" x2="540" y2="260" stroke="#334155" stroke-width="1"/>
  <text x="75" y="250" fill="#cbd5e1" font-size="11" font-family="monospace">BCU-SE-105</text>
  <text x="180" y="250" fill="#ffffff" font-size="11" font-family="sans-serif">Priya Sharma</text>
  <text x="320" y="250" fill="#a5b4fc" font-size="11" font-family="sans-serif">Computer Science</text>
  <rect x="450" y="237" width="65" height="18" rx="9" fill="#065f46"/>
  <text x="462" y="250" fill="#34d399" font-size="10" font-weight="bold" font-family="sans-serif">ACTIVE</text>

  <!-- Row 3 -->
  <text x="75" y="285" fill="#cbd5e1" font-size="11" font-family="monospace">BCU-SE-109</text>
  <text x="180" y="285" fill="#ffffff" font-size="11" font-family="sans-serif">Marcus Vance</text>
  <text x="320" y="285" fill="#a5b4fc" font-size="11" font-family="sans-serif">Cyber Security</text>
  <rect x="450" y="272" width="75" height="18" rx="9" fill="#78350f"/>
  <text x="458" y="285" fill="#fde68a" font-size="10" font-weight="bold" font-family="sans-serif">GRADUATED</text>
